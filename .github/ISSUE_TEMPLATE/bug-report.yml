name: Bug report
description: Report a reproducible problem in the portfolio.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: List the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on Windows 11, iPhone 15 on Safari, etc.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, or links if they help explain the issue.
